<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>妙語說書人計分板</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#23211d;--muted:#6f6a5f;--line:#e4e0d6;
  --accent:#5b4bd5;--accent-ink:#fff;--accent-soft:#ebe8fc;
  --good:#1f8a4c;--warn:#c2410c;--warn-soft:#fdeee4;--gold:#d99a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17161a;--card:#222126;--ink:#f1eee8;--muted:#a09b90;--line:#37353c;
  --accent:#8f83ff;--accent-ink:#14121f;--accent-soft:#2c2850;--good:#4cc27f;--warn:#fb923c;--warn-soft:#3a2417;--gold:#f2b429}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sm{min-height:44px;min-width:44px;padding:0 10px}
button,input{touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button{transition:background-color .15s,border-color .15s,transform .1s}
svg.i{width:1.1em;height:1.1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .top b,td,.plus{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
input{font:inherit;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.mode{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.mode b{font-size:15px}
.players li{display:flex;gap:6px;align-items:center;padding:4px 0;list-style:none}
.players{padding:0;margin:0 0 10px}
.players input{flex:1}
.bar{margin:8px 0}
.bar .top{display:flex;justify-content:space-between;font-size:15px}
.bar .track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.lead .fill{background:var(--gold)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.vote{padding:10px 0;border-top:1px solid var(--line)}
.vote:first-of-type{border-top:0}
.vote .who{font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.st{border-style:dashed}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.win{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--gold);color:#222;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:18px;text-align:center}
.res li{list-style:none;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.res{padding:0;margin:8px 0 0}
.res .src{color:var(--muted);font-size:13px}
.plus{color:var(--good);font-weight:700}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:center;white-space:nowrap}
th{background:var(--bg)}
tr.total td{font-weight:700;background:var(--accent-soft)}
.muted{color:var(--muted);font-size:14px}
label{font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>妙語說書人計分板</h1>
  <p class="sub">點選每位閒家投給誰，按「計算本回合」自動算分</p>
  <div id="app"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const KEY = "dixit-scoreboard-v1";
const MIN_P = 3, MAX_P = 12;

let S = load();

function fresh(){
  return {players:[], target:30, storyteller:null, votes:{}, history:[], names:{}, nextId:1};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.players)) return Object.assign(fresh(), d); }
  }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function commit(){ save(); render(); }

/* ---------- 規則 ---------- */
function modeOf(n){
  if(n <= 3) return {key:3, name:"3 人模式", hand:7, play:2, refill:2, cap:Infinity,
    tip:"每人 7 張手牌，閒家每人出 2 張，回合結束每人補 2 張"};
  if(n <= 6) return {key:6, name:"4–6 人模式（標準）", hand:6, play:1, refill:1, cap:Infinity,
    tip:"每人 6 張手牌，閒家每人出 1 張，回合結束每人補 1 張"};
  return {key:7, name:"7 人以上模式", hand:6, play:1, refill:1, cap:3,
    tip:"每人 6 張手牌，閒家每人出 1 張，回合結束每人補 1 張；混淆卡加分最多 +3。迪士尼版只有 6 個投票盤，請用手勢比號碼或拆桌"};
}

// votes: {voterId: targetId}; 回傳 {level, guessed, notGuessed, gains:{id:{guess,decoy,decoyRaw,story}}}
function score(playerIds, storyId, votes, mode){
  const gains = {};
  playerIds.forEach(id => gains[id] = {guess:0, decoy:0, decoyRaw:0, story:0});
  const guessers = playerIds.filter(id => id !== storyId);
  let guessed = 0;
  guessers.forEach(v => {
    const t = votes[v];
    if(t === storyId){ gains[v].guess = 1; guessed++; }
    else if(t != null && gains[t]) gains[t].decoyRaw++;
  });
  const notGuessed = guessers.length - guessed;
  playerIds.forEach(id => { gains[id].decoy = Math.min(gains[id].decoyRaw, mode.cap); });
  let level = "partial";
  if(guessed === guessers.length) level = "all";
  else if(guessed === 0) level = "none";
  gains[storyId].story = level === "partial" ? Math.min(guessed, notGuessed) : 0;
  return {level, guessed, notGuessed, gains};
}
function gainTotal(g){ return g.guess + g.decoy + g.story; }

function totals(){
  const t = {};
  S.history.forEach(r => { for(const id in r.delta) t[id] = (t[id]||0) + r.delta[id]; });
  return t;
}

/* ---------- 操作 ---------- */
function addPlayer(name){
  name = name.trim();
  if(!name) return;
  if(S.players.length >= MAX_P){ toast("最多 " + MAX_P + " 人"); return; }
  const id = "p" + (S.nextId++);
  S.players.push({id, name});
  S.names[id] = name;
  if(S.storyteller == null) S.storyteller = id;
  commit();
}
function renamePlayer(id, name){
  name = name.trim();
  const p = S.players.find(p => p.id === id);
  if(!p || !name) return;
  p.name = name; S.names[id] = name; save();
}
function removePlayer(id){
  const p = S.players.find(p => p.id === id);
  if(!p) return;
  if(!confirm("刪除「" + p.name + "」？已結算的分數紀錄仍會保留在紀錄表。")) return;
  const idx = S.players.indexOf(p);
  S.players.splice(idx, 1);
  delete S.votes[id];
  for(const v in S.votes) if(S.votes[v] === id) delete S.votes[v];
  if(S.storyteller === id) S.storyteller = S.players.length ? S.players[idx % S.players.length].id : null;
  commit();
}
function movePlayer(id, dir){
  const i = S.players.findIndex(p => p.id === id), j = i + dir;
  if(j < 0 || j >= S.players.length) return;
  [S.players[i], S.players[j]] = [S.players[j], S.players[i]];
  commit();
}
function setStoryteller(id){
  S.storyteller = id;
  delete S.votes[id];
  commit();
}
function setVote(voter, target){
  if(S.votes[voter] === target) delete S.votes[voter]; else S.votes[voter] = target;
  commit();
}
function setTarget(v){
  v = parseInt(v, 10);
  if(v > 0){ S.target = v; commit(); }
}

let lastResult = null;
function settle(){
  const ids = S.players.map(p => p.id);
  if(ids.length < MIN_P){ toast("至少需要 " + MIN_P + " 位玩家"); return; }
  const missing = ids.filter(id => id !== S.storyteller && S.votes[id] == null);
  if(missing.length) return; // UI 已列出未投的人
  const mode = modeOf(ids.length);
  const r = score(ids, S.storyteller, S.votes, mode);
  const delta = {};
  ids.forEach(id => delta[id] = gainTotal(r.gains[id]));
  S.history.push({
    n: S.history.length + 1, storyteller: S.storyteller, votes: Object.assign({}, S.votes),
    mode: mode.key, level: r.level, guessed: r.guessed, notGuessed: r.notGuessed,
    gains: r.gains, delta, ids
  });
  lastResult = S.history[S.history.length - 1];
  // 下一位說書人
  const i = ids.indexOf(S.storyteller);
  S.storyteller = ids[(i + 1) % ids.length];
  S.votes = {};
  commit();
  window.scrollTo({top:0, behavior:"smooth"});
}
function undo(){
  const r = S.history.pop();
  if(!r) return;
  S.storyteller = S.players.some(p => p.id === r.storyteller) ? r.storyteller : (S.players[0] && S.players[0].id);
  S.votes = {};
  for(const v in r.votes){
    if(S.players.some(p => p.id === v) && S.players.some(p => p.id === r.votes[v])) S.votes[v] = r.votes[v];
  }
  lastResult = null;
  commit();
}
function resetAll(){
  if(!confirm("全部重來？保留玩家名單，清空分數與紀錄。")) return;
  S.history = []; S.votes = {}; lastResult = null;
  S.storyteller = S.players[0] ? S.players[0].id : null;
  commit();
}

/* ---------- 匯出 ---------- */
function exportTSV(){
  const seen = [];
  S.history.forEach(r => r.ids.forEach(id => { if(!seen.includes(id)) seen.push(id); }));
  S.players.forEach(p => { if(!seen.includes(p.id)) seen.push(p.id); });
  const nm = id => S.names[id] || id;
  const lines = [];
  lines.push(["回合","說書人","結果"].concat(seen.map(nm)).join("\t"));
  const run = {};
  S.history.forEach(r => {
    seen.forEach(id => run[id] = (run[id]||0) + (r.delta[id]||0));
    lines.push([r.n, nm(r.storyteller), levelText(r)].concat(seen.map(id => r.ids.includes(id) ? run[id] : "")).join("\t"));
  });
  lines.push(["總分","",""].concat(seen.map(id => run[id]||0)).join("\t"));
  const text = lines.join("\n");
  const done = () => toast("已複製，可直接貼進 Excel");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("複製失敗，請手動複製"); }
  ta.remove();
}

/* ---------- 畫面 ---------- */
const ICON = {
  trophy:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>',
  crown:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5L3 8z"/></svg>',
  up:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  x:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf = id => esc(S.names[id] || "?");
function levelText(r){
  return r.level === "all" ? "全部猜中" : r.level === "none" ? "全部沒猜中" : "部分猜中（" + r.guessed + " 人猜中）";
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2000);
}

function render(){
  const app = document.getElementById("app");
  // 保留輸入焦點的值
  const n = S.players.length;
  const mode = modeOf(n);
  const tot = totals();
  const maxScore = Math.max(S.target, ...S.players.map(p => tot[p.id] || 0));
  let html = "";

  // 獲勝
  const top = Math.max(0, ...S.players.map(p => tot[p.id] || 0));
  if(S.history.length && top >= S.target){
    const winners = S.players.filter(p => (tot[p.id]||0) === top).map(p => esc(p.name));
    html += `<div class="win" role="status">${ICON.trophy}<span>${winners.join("、")} ${winners.length > 1 ? "並列獲勝" : "獲勝"}（${top} 分）</span></div>`;
  }

  // 上一回合結果
  if(lastResult && S.history[S.history.length-1] === lastResult){
    const r = lastResult;
    html += `<section><h2>第 ${r.n} 回合結果</h2>
      <div class="muted">說書人 ${nameOf(r.storyteller)}・${levelText(r)}</div><ul class="res">`;
    r.ids.forEach(id => {
      const g = r.gains[id], parts = [];
      if(g.story) parts.push("說書人 +" + g.story);
      if(g.guess) parts.push("猜中 +1");
      if(g.decoy) parts.push("混淆卡 " + g.decoyRaw + " 票 +" + g.decoy + (g.decoyRaw > g.decoy ? "（上限）" : ""));
      html += `<li><b>${nameOf(id)}</b> <span class="plus">+${r.delta[id]}</span>
        <div class="src">${parts.length ? parts.join("　") : "本回合沒有得分"}</div></li>`;
    });
    html += `</ul></section>`;
  }

  // 玩家
  html += `<section><h2>玩家（${n}／${MAX_P}）</h2>
    <ul class="players">`;
  S.players.forEach((p, i) => {
    html += `<li>
      <input value="${esc(p.name)}" data-rename="${p.id}" maxlength="12" aria-label="玩家 ${i+1} 名稱">
      <button class="sm" data-move="${p.id}" data-dir="-1" ${i===0?"disabled":""} aria-label="上移 ${esc(p.name)}">${ICON.up}</button>
      <button class="sm" data-move="${p.id}" data-dir="1" ${i===n-1?"disabled":""} aria-label="下移 ${esc(p.name)}">${ICON.down}</button>
      <button class="sm danger" data-del="${p.id}" aria-label="刪除 ${esc(p.name)}">${ICON.x}</button></li>`;
  });
  html += `</ul>
    <form class="row" id="addForm"><input class="grow" id="newName" aria-label="新玩家名字" placeholder="輸入玩家名字" maxlength="12" ${n>=MAX_P?"disabled":""}>
      <button class="primary" ${n>=MAX_P?"disabled":""}>加入</button></form>
    <div class="muted" style="margin-top:8px">請依座位順時針排序；說書人會依名單順序輪替。至少 ${MIN_P} 人。</div>
    <div class="row" style="margin-top:10px"><label for="target">目標分數</label>
      <input id="target" type="number" inputmode="numeric" min="1" value="${S.target}" style="width:90px"></div>
  </section>`;

  if(n >= MIN_P){
    html += `<section><div class="mode"><b>${mode.name}</b><br>${mode.tip}</div>`;

    // 投票
    const st = S.storyteller;
    html += `<h2 style="margin-top:14px">第 ${S.history.length + 1} 回合・說書人：${nameOf(st)}</h2>
      <div class="row wrap" style="margin-bottom:6px"><span class="muted">更換說書人：</span>`;
    S.players.forEach(p => {
      html += `<button class="sm chip ${p.id===st?"on":""}" data-story="${p.id}" aria-pressed="${p.id===st}">${p.id===st?ICON.check+" ":""}${esc(p.name)}</button>`;
    });
    html += `</div><div class="muted" style="margin-bottom:6px">每位閒家點選「投給誰」（不含自己）</div>`;
    const missing = [];
    S.players.forEach(p => {
      if(p.id === st) return;
      if(S.votes[p.id] == null) missing.push(esc(p.name));
      html += `<div class="vote"><div class="who">${esc(p.name)} 投給</div><div class="chips">`;
      S.players.forEach(q => {
        if(q.id === p.id) return;
        const on = S.votes[p.id] === q.id;
        html += `<button class="chip ${on?"on":""} ${q.id===st?"st":""}" data-vote="${p.id}" data-target="${q.id}" aria-pressed="${on}">${on?ICON.check+" ":""}${esc(q.name)}${q.id===st?"（說書人）":""}</button>`;
      });
      html += `</div></div>`;
    });
    if(missing.length) html += `<div class="alert" role="status">還沒投票：${missing.join("、")}</div>`;
    html += `<button class="primary" id="settle" style="width:100%;margin-top:6px" ${missing.length?"disabled":""}>計算本回合</button>
      <div class="row" style="margin-top:8px">
        <button class="grow" id="undo" ${S.history.length?"":"disabled"}>復原上一回合</button>
      </div></section>`;
  } else {
    html += `<section><div class="alert">再加入 ${MIN_P - n} 位玩家就能開始（最少 ${MIN_P} 人）。</div></section>`;
  }

  // 計分榜
  if(n){
    html += `<section><h2>計分榜（目標 ${S.target} 分）</h2>`;
    const sorted = S.players.slice().sort((a,b) => (tot[b.id]||0) - (tot[a.id]||0));
    sorted.forEach(p => {
      const sc = tot[p.id]||0, lead = S.history.length && sc === top && top > 0;
      html += `<div class="bar ${lead?"lead":""}"><div class="top"><span>${lead?ICON.crown+" ":""}${esc(p.name)}${p.id===S.storyteller?'<span class="tag">說書人</span>':""}</span><b>${sc}</b></div>
        <div class="track"><div class="fill" style="width:${Math.min(100, sc/maxScore*100)}%"></div></div></div>`;
    });
    html += `</section>`;
  }

  // 紀錄
  html += `<section><h2>回合紀錄</h2>`;
  if(!S.history.length) html += `<div class="muted">還沒有紀錄。</div>`;
  else {
    const seen = [];
    S.history.forEach(r => r.ids.forEach(id => { if(!seen.includes(id)) seen.push(id); }));
    S.players.forEach(p => { if(!seen.includes(p.id)) seen.push(p.id); });
    html += `<div class="tablewrap"><table><tr><th>回合</th><th>說書人</th><th>結果</th>${seen.map(id => `<th>${nameOf(id)}</th>`).join("")}</tr>`;
    const run = {};
    S.history.forEach(r => {
      seen.forEach(id => run[id] = (run[id]||0) + (r.delta[id]||0));
      html += `<tr><td>${r.n}</td><td>${nameOf(r.storyteller)}</td><td>${levelText(r)}</td>${seen.map(id => `<td>${r.ids.includes(id) ? run[id] + (r.delta[id] ? ` <span class="plus">+${r.delta[id]}</span>` : "") : "–"}</td>`).join("")}</tr>`;
    });
    html += `<tr class="total"><td colspan="3">總分</td>${seen.map(id => `<td>${run[id]||0}</td>`).join("")}</tr></table></div>`;
  }
  html += `<div class="row wrap" style="margin-top:10px">
      <button class="primary grow" id="export" ${S.history.length?"":"disabled"}>複製成 Excel 表格</button>
      <button class="danger" id="reset" ${S.history.length?"":"disabled"}>全部重來</button></div></section>`;

  const active = document.activeElement;
  let sel = null;
  if(active && active !== document.body){
    if(active.id) sel = "#" + active.id;
    else for(const k of ["vote","story","move","del","rename"]) if(active.dataset && active.dataset[k]){
      sel = "[data-" + k + '="' + active.dataset[k] + '"]' + (active.dataset.target ? '[data-target="' + active.dataset.target + '"]' : "") + (active.dataset.dir ? '[data-dir="' + active.dataset.dir + '"]' : "");
      break;
    }
  }
  app.innerHTML = html;
  if(sel){ const el = app.querySelector(sel); if(el && !el.disabled) el.focus({preventScroll:true}); }
}

/* ---------- 事件 ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.vote) setVote(b.dataset.vote, b.dataset.target);
  else if(b.dataset.story) setStoryteller(b.dataset.story);
  else if(b.dataset.move) movePlayer(b.dataset.move, +b.dataset.dir);
  else if(b.dataset.del) removePlayer(b.dataset.del);
  else if(b.id === "settle") settle();
  else if(b.id === "undo") undo();
  else if(b.id === "export") exportTSV();
  else if(b.id === "reset") resetAll();
});
document.addEventListener("submit", e => {
  if(e.target.id === "addForm"){
    e.preventDefault();
    const inp = document.getElementById("newName");
    addPlayer(inp.value);
    const again = document.getElementById("newName"); if(again) { again.value = ""; again.focus(); }
  }
});
document.addEventListener("change", e => {
  if(e.target.dataset.rename){ renamePlayer(e.target.dataset.rename, e.target.value); render(); }
  else if(e.target.id === "target") setTarget(e.target.value);
});

render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  // 單一檔案頁面，載入後本身即可離線運作；不需額外快取
}

/* 驗收案例自測：在主控台執行 selfTest() */
function selfTest(){
  const cases = [
    {n:5, v:{A:"S",B:"A",C:"S",D:"B"}, exp:{S:2,A:2,B:1,C:1,D:0}},
    {n:3, v:{A:"B",B:"A"}, exp:{S:0,A:1,B:1}},
    {n:3, v:{A:"S",B:"S"}, exp:{S:0,A:1,B:1}},
    {n:7, v:{A:"S",B:"C",C:"D",D:"C",E:"C",F:"C"}, exp:{S:1,A:1,B:0,C:3,D:1,E:0,F:0}},
  ];
  return cases.map(c => {
    const ids = Object.keys(c.exp);
    const r = score(ids, "S", c.v, modeOf(ids.length));
    return ids.every(id => gainTotal(r.gains[id]) === c.exp[id]);
  });
}
